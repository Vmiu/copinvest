[tool.setuptools.packages.find]
include = ["backend*"]

[project]
name = "copinvest"
version = "0.1.0"
description = "GenAI assistant for investment advisers in Hong Kong"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.22.0",
    "alembic>=1.18.0",
    "qdrant-client>=1.17.0",
    "pyjwt>=2.12.0",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.0.0",
    "python-multipart>=0.0.27",
    "docling>=2.12.0",
    "pymupdf>=1.27.0",
    "openai>=1.68.0",
    "python-telegram-bot>=22.7",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
